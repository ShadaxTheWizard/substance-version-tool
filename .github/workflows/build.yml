# Builds Substance Version Tool for Linux (AppImage) and Windows (installer + portable zip) on every
# push and pull request; each run keeps the builds as artifacts on its page.
#
# Pushing a tag vX.Y.Z (matching __version__ in spp_convert.py) also creates the GitHub
# release for that tag with all builds and their .sha256 files attached. It uses only the
# workflow's own GITHUB_TOKEN; there are no other secrets.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    # Debian 12 rather than the runner's Ubuntu 24.04: PyInstaller bundles the system
    # libraries it finds, and older ones keep the AppImage running on older systems.
    container: node:22-bookworm
    env:
      LANG: C.UTF-8
    steps:
      # Actions are pinned by commit: a tag can be moved, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Libraries Qt loads at run time, and squashfs-tools to pack the AppImage. The first
      # line lets the self-test start the app (offscreen). The xcb ones are not needed here,
      # but PyInstaller bundles whatever it finds, and Qt's X11 support needs
      # libxcb-cursor0, which e.g. Ubuntu does not install by default.
      - name: System packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1 \
            squashfs-tools >/dev/null

      - name: Build and self-test
        run: packaging/build-linux.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux-x86_64
          path: dist/
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build and self-test
        run: packaging/build-windows.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-x64
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          sed "s/{version}/$version/g" packaging/release-notes.md > "$RUNNER_TEMP/notes.md"
          ls -l dist/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag \
              --title "Substance Version Tool $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
