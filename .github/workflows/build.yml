# Builds Substance Version Tool for Linux (AppImage) and Windows (installer + portable zip) on every
# push and pull request; each run keeps the builds as artifacts on its page.
#
# Pushing a tag vX.Y.Z (matching __version__ in spp_convert.py) also creates the GitHub
# release for that tag with all builds and their .sha256 files attached.
#
# Windows code signing (SignPath Foundation) runs on release tags once it is set up in the
# repository settings, never from code in this file:
#   variable  SIGNPATH_ORGANIZATION_ID   turns signing on
#   secret    SIGNPATH_API_TOKEN         SignPath API token of a submitter
#   variables SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG   optional, see the defaults below
# Each signing request waits for its approval in SignPath (two per release: the app, then the
# installer built from the signed app). Without the variable, builds are left unsigned.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    # Debian 12 rather than the runner's Ubuntu 24.04: PyInstaller bundles the system
    # libraries it finds, and older ones keep the AppImage running on older systems.
    container: node:22-bookworm
    env:
      LANG: C.UTF-8
    steps:
      # Actions are pinned by commit: a tag can be moved, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Libraries Qt loads at run time, and squashfs-tools to pack the AppImage. The first
      # line lets the self-test start the app (offscreen). The xcb ones are not needed here,
      # but PyInstaller bundles whatever it finds, and Qt's X11 support needs
      # libxcb-cursor0, which e.g. Ubuntu does not install by default.
      - name: System packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1 \
            squashfs-tools >/dev/null

      - name: Build and self-test
        run: packaging/build-linux.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux-x86_64
          path: dist/
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build and self-test the app
        id: app
        run: |
          packaging/build-windows.sh bundle
          echo "version=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" spp_convert.py)" >> "$GITHUB_OUTPUT"

      # --- signing the app (release tags with SignPath set up) ---
      - name: Upload the app for signing
        id: unsigned-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-app-unsigned
          path: build/windows/out/
          if-no-files-found: error

      - name: Sign the app (approve the request in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'substance-version-tool' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 7200
          # Checked by the artifact configuration against the files' product version.
          parameters: |
            version: "${{ steps.app.outputs.version }}"
          output-artifact-directory: build/windows/signed-app

      - name: Use the signed app
        if: env.SIGN == 'true'
        run: |
          rm -rf "build/windows/out/Substance Version Tool"
          mv "build/windows/signed-app/Substance Version Tool" build/windows/out/
          packaging/build-windows.sh selftest

      - name: Installer and portable zip
        run: packaging/build-windows.sh package

      # --- signing the installer ---
      - name: Stage the installer for signing
        if: env.SIGN == 'true'
        run: |
          mkdir -p build/windows/setup
          cp dist/*-setup.exe build/windows/setup/setup.exe
      - name: Upload the installer for signing
        if: env.SIGN == 'true'
        id: unsigned-setup-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-setup-unsigned
          path: build/windows/setup/
          if-no-files-found: error

      - name: Sign the installer (approve the request in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'substance-version-tool' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup-artifact.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 7200
          # Checked by the artifact configuration against the files' product version.
          parameters: |
            version: "${{ steps.app.outputs.version }}"
          output-artifact-directory: build/windows/signed-setup

      - name: Use the signed installer
        if: env.SIGN == 'true'
        run: |
          cp build/windows/signed-setup/setup.exe dist/*-setup.exe
          packaging/build-windows.sh checksums

      - name: Check the signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $files = @(Get-Item "build/windows/out/Substance Version Tool/Substance Version Tool.exe") + @(Get-ChildItem dist/*-setup.exe)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            "{0}: {1} ({2})" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed" }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-x64
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          # The "not signed yet" paragraph only while Windows signing is not set up.
          if [ -n "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ]; then drop='/<!-- unsigned -->/,/<!-- \/unsigned -->/d'
          else drop='/<!-- \/\{0,1\}unsigned -->/d'; fi
          sed -e "$drop" -e "s/{version}/$version/g" packaging/release-notes.md > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          ls -l dist/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag \
              --title "Substance Version Tool $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
